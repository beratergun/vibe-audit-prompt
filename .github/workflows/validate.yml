name: Validate documentation pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-11-01
        with:
          persist-credentials: false
      - name: Check package consistency
        run: node scripts/check.mjs
      - name: Test validator failure cases
        run: node --test scripts/check.test.mjs
